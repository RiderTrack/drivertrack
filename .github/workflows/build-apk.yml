name: Build DriverTrack APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # El runner ubuntu-latest ya trae el Android SDK preinstalado
      # (ANDROID_SDK_ROOT + build-tools + platform-tools). La action
      # android-actions/setup-android falla intermitentemente por el
      # license del SDK Preview — no es necesaria aquí.
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build React App
        run: npm run build

      - name: Add Android platform
        run: npx cap add android || true

      - name: Copy web assets to Android
        run: npx cap copy android

      - name: Sync Capacitor plugins
        run: npx cap sync android

      # Nombre y esquema de la app (DriverTrack)
      - name: Configure app strings
        run: |
          mkdir -p android/app/src/main/res/values
          echo '<?xml version="1.0" encoding="utf-8"?><resources><string name="app_name">DriverTrack</string><string name="title_activity_main">DriverTrack</string><string name="package_name">com.drivertrack.app</string><string name="custom_url_scheme">com.drivertrack.app</string></resources>' > android/app/src/main/res/values/strings.xml

      # Permisos: INTERNET (webviews), VIBRATE (celebración meta),
      # CAMERA (listo para F-ID2: foto → OCR Gemini),
      # FINE+COARSE LOCATION (F-ID3.2: km GPS por viaje — sin estos
      # Android ni muestra "Ubicación" en los permisos de la app)
      - name: Update AndroidManifest permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />\n    <application|' "$MANIFEST"

      # F-ID5: 🤖 el robot de cobro vive en Termux, en ESTE mismo teléfono.
      # La app le habla por http://127.0.0.1:3001 — Android bloquea HTTP
      # "en claro" por defecto (API 28+) → esta config lo permite SOLO
      # para localhost/127.0.0.1 (el resto del tráfico sigue exigiendo
      # HTTPS). Sin esto, el fetch al puente falla en silencio.
      - name: Allow cleartext to localhost only (F-ID5 robot bridge)
        run: |
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/network_security_config.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="false" />
              <domain-config cleartextTrafficPermitted="true">
                  <domain includeSubdomains="false">127.0.0.1</domain>
                  <domain includeSubdomains="false">localhost</domain>
              </domain-config>
          </network-security-config>
          EOF
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's|android:allowBackup="true"|android:allowBackup="true"\n        android:networkSecurityConfig="@xml/network_security_config"|' "$MANIFEST"
          grep -q "networkSecurityConfig" "$MANIFEST" && echo "✅ networkSecurityConfig agregado al manifest"

      - name: Set Gradle permissions
        run: chmod +x android/gradlew

      # Build RELEASE (APK optimizado, sin debugging) — mismo approach F-AUD1 de RiderTrack
      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      # Keystore estable guardado en Secrets → todas las APKs salen
      # firmadas IGUAL → las actualizaciones instalan encima sin desinstalar.
      - name: Restore or generate keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "✅ Usando keystore guardado en Secrets (firma estable)"
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          else
            echo "⚠️ No hay KEYSTORE_BASE64 — generando nuevo (¡firma inestable!)"
            keytool -genkeypair \
              -keystore release.keystore \
              -alias drivertrack \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass drivertrack123 -keypass drivertrack123 \
              -dname "CN=DriverTrack, OU=Dev, O=RiderTrack, L=Lima, S=Lima, C=PE"
          fi

      - name: Zipalign APK
        run: |
          ZIPALIGN=$(find $ANDROID_SDK_ROOT -name "zipalign" | head -1)
          $ZIPALIGN -v -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk DriverTrack-aligned.apk

      - name: Sign APK
        run: |
          APKSIGNER=$(find $ANDROID_SDK_ROOT -name "apksigner" | head -1)
          $APKSIGNER sign --ks release.keystore --ks-key-alias drivertrack --ks-pass pass:drivertrack123 --key-pass pass:drivertrack123 --out DriverTrack.apk DriverTrack-aligned.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: DriverTrack-APK
          path: DriverTrack.apk
          retention-days: 30
